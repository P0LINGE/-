<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title> 小さな光 💞</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body style="text-align:center;font-family:Arial;background:#fff0f5">

<h2>💓 Conexión Viva</h2>
<p id="estado">Esperando señal…</p>

  <button onclick="enviar('UNA FLOR')"> UNA FLOR</button><br><br>
  <button onclick="enviar('UN DULCE')">UN DULCE</button><br><br>
  <button onclick="enviar('UN CORAZON')">🤍 UN CORAZON </button><br><br>
  <button onclick="enviar('ME GUSTÓ')">💓 ME GUSTÓ</button>

<script>
const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

client.on("connect",()=>{
  client.subscribe("amor/estado");
});

client.on("message",(t,m)=>{
  document.getElementById("estado").innerText = m.toString();
});

function enviar(cmd){
  client.publish("amor/comando",cmd);
}
</script>

</body>
</html>
